[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "Multi-agent AI travel planner with human-in-the-loop approval (LangGraph + FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langchain-core>=0.3.25",
    "langgraph>=0.2.60,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "langchain-openai>=0.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
travel-planner = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]